name: M4 temporary validation

on:
  push:
    branches:
      - bot/m4-fix-20260923

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g0.5-real-validation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest safetensors numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax checks
        run: |
          python -m py_compile wan/image2video.py scripts/compare_m4_latents.py
          bash -n scripts/m4_13frame_smoke.sh
          git diff --check

      - name: Run staged/equivalence unit tests
        run: |
          pytest -q tests/test_m4_equivalence.py tests/test_m36_staged.py
